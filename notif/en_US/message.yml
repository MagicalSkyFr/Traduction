      1: '<color:#ffc933>See how to build it:'
      2: /multiblocks
      3: '<color:#ffc933>More information:'
      4: /wiki mbameliorateur
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ You've become very strong. However constantly\nꖰ creating new equipment\nꖰ is expensive. Create <color:#ffc933>an upgrade</color>\nꖰ <color:#ffc933>multiblock</color> and upgrade your equipment!\n\n"
    objectif:
      1: Upgrade 1 piece of equipment
      2: <color:#ffc933>in the upgrader
  warpcreate:
    astuce:
      1: '<color:#ffc933>Create a warp: </color><color:white>/is setwarp nom'
      2: '<color:#ffc933>More information: </color><color:white>/wiki iswarp'
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ The auction house is useful for selling\nꖰ rare items but not for selling\nꖰ in large quantities. We'll fix that\nꖰ by creating <color:#ffc933>a warp directly on your island</color>!\n\n"
    objectif:
      1: Create an island warp
  warpunlock:
    astuce:
      1: <color:#ffc933>/wiki warps
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ While exploring this new world, <color:#ffc933>right-click</color>\nꖰ on the beacons to unlock them. You'll then\nꖰ be able to teleport there with the command <color:#ffc933>/warps</color>.\n\n"
    objectif:
      1: Unlock a beacon <color:white>(/warps)
  water_stick:
    astuce:
      1: <color:#ffc933>/wiki magie
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ There are also <color:#ffc933>weapons and wands</color>\nꖰ <color:#ffc933>magic</color> to attack monsters. I've spotted one\nꖰ <color:#ffc933>near the houses that are</color>\nꖰ <color:#ffc933>on the lake</color>. Go get it!\n\n"
    objectif:
      1: Get 1 Water Wand
  wikimineur:
    astuce:
      1: <color:#ffc933>/wiki mineur
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ Our axe is now nice and sharp,

      ꖰ we can try out <color:#ffc933>your new pickaxe</color>!

      ꖰ Use it to break

      ꖰ <color:#ffc933>some stones</color>.


      '
    objectif:
      1: Break 16 stone blocks <color:white>(%tutoriel_COBBLESTONE_value%/%tutoriel_COBBLESTONE_max%)</color>
