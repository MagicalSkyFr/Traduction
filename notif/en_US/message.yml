      1: Build a workbench multiblock on your island
  unlock_skill:
    message: "\nꗊ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Good. Upgrade your gear and your sword\nꖰ by unlocking <color:#ffc933>your first skills</color>\nꖰ with the command <color:#ffc933>/classe</color>. You need\nꖰ MORE POWER.\n\n"
    objectif:
      1: Unlock skills x (/classe)
  unlock_skill_axe_pickaxe:
    astuce:
      1: <color:#ffc933>/wiki competence
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

