tutoriel:
  add_sort:
    astuce:
      1: HOW TO CONFIGURE
    message: ꗎ
    objectif:
      1: Add spell X to your wand
  ahdeposit:
    astuce:
      1: '<color:#ffc933>Sell in the auction house:'
      2: /ah sell
      3: <color:#ffc933>More information:</color> <color:white>/wiki ah
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Chasséros is... motivated, let's say. Fighting\nꖰ in dungeons and elsewhere can give resources\nꖰ unsellable at the adminshop. List them\nꖰ in <color:#ffc933>the auction house</color>!\n\n"
    objectif:
      1: List an item in
      2: <color:#ffc933>the auction house</color> <color:white>(/ah)
  bestiaireunlock:
    astuce:
      1: '<color:#ffc933>Open the bestiary: </color><color:white>/bestiaire'
      2: '<color:#ffc933>More info: </color><color:white>/wiki bestiaire'
    message: "\nꗊ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Yes, you're finally ready to come wreak havoc\nꖰ with me! <color:#ffc933>Complete your bestiary</color> by killing\nꖰ every animal that exists in this dimension!\n\n"
    objectif:
      1: Kill the 16 different animals
      2: <color:#ffc933>of the hunting ground </color><color:white>(%tutoriel_shadow%/16)
  challenge_1:
    astuce:
      1: '<color:#ffc933>See the challenges </color><color:white>: /challenge'
      2: '<color:#ffc933>More information </color><color:white>: /wiki challenge'
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ The challenges you''ve completed help you progress

      ꖰ in <color:#ffc933>the tutorial challenge</color>. It''s very useful because

      ꖰ it will give you useful rewards, such

      ꖰ as <color:#ffc933>new magic tools</color>!


      '
    objectif:
      1: Complete step 1 of the <color:white>tutorial challenge
  challenge_2:
    astuce:
      1: '<color:#ffc933>See the challenges </color><color:white>: /challenge'
      2: '<color:#ffc933>More information </color><color:white>: /wiki challenge'
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ We''re going to leave the island and discover the incredible

      ꖰ <color:#ffc933>dimensions</color>! For that we''ll need items

      ꖰ that you can get by completing

      ꖰ <color:#ffc933>tutorial challenge 2</color>.


      '
    objectif:
      1: Complete step 1 of the <color:white>tutorial challenge
  challengepierre:
    astuce:
      1: <color:#ffc933>/wiki collection
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ You completed a challenge! Do <color:#ffc933>/challenge</color>

      ꖰ to see them all. <color:#ffc933>Collection challenges</color>

      ꖰ give useful rewards to help you progress.

      ꖰ Complete one!


      '
    objectif:
      1: Complete the challenge
      2: <color:white>Merchant Miner 1
  chapanda:
    astuce:
      1: '<color:#ffc933>See how to create it: </color><color:white>/crafts'
      2: '<color:#ffc933>More information: </color><color:white>/wiki stuff'
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ That's not the only useful thing in combat that\nꖰ you can find in the dimension. You can\nꖰ also create <color:#ffc933>very powerful equipment</color>\nꖰ thanks to resources from monsters. Try it!\n\n"
    objectif:
      1: Create 1 Chapanda
  chene:
    astuce:
      1: <color:#ffc933>Info about woodcutting:</color>
      2: /wiki bucheron
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ You learn fast! Let''s start by discovering

      ꖰ <color:#ffc933>the axe</color>. Try it on a tree and <color:#ffc933>break</color>

      ꖰ <color:#ffc933>the leaves with it</color>, this will give you <color:#ffc933>insects</color>

      ꖰ thanks to the unlocked skill!


      '
    objectif:
      1: Break 8 oak logs <color:white>(%tutoriel_OAK_LOG_value%/%tutoriel_OAK_LOG_max%)
      2: <color:#ffc933>and 4 oak leaves</color> <color:white>(%tutoriel_OAK_LEAVES_value%/%tutoriel_OAK_LEAVES_max%)
  choose_jobs:
    astuce:
      1: <color:#ffc933>/wiki metier
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ We''re now going to upgrade your island.

      ꖰ For that we need <color:#ffc933>MCoins</color>, our

      ꖰ local currency. <color:#ffc933>Choose a job</color> and sell

      ꖰ items <color:#ffc933>at the adminshop</color> to get some.


      '
    objectif:
      1: Choose a job <color:white>(/jobs)
  cinema:
    astuce:
      1: <color:#ffc933>You can find tutorials to
      2: <color:#ffc933>create a generator online.
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ Your generator is fine but it won''t be enough

      ꖰ to grow your island. Create a

      ꖰ <color:#ffc933>more efficient generator</color> and use it to

      ꖰ mine more blocks!


      '
    objectif:
      1: Break 50 stone blocks <color:white>(%tutoriel_COBBLESTONE_value%/%tutoriel_COBBLESTONE_max%)
  claim_axe_pickaxe:
    astuce:
      1: <color:#ffc933>/wiki outil
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ On your island there is <color:#ffc933>a magic axe and pickaxe</color>

      ꖰ that will help you. Get them! And if friends

      ꖰ are waiting for you, now''s the time to accept their

      ꖰ invitation by doing <color:#ffc933>/is invite</color>.


      '
    objectif:
      1: 'Get the magic axe and pickaxe  '
  classe5:
    astuce:
      1: <color:#ffc933>/wiki classe
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ The area we're in is only a small part\nꖰ of the dimension. Move up to the next step\nꖰ by reaching <color:#ffc933>class level 5</color><color:white>!</color>\n\n"
    objectif:
      1: Reach level
      2: <color:#ffc933>class 5
  compost:
    astuce:
      1: <color:#ffc933>/wiki mbcompost
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Fighting here gives access to resources\nꖰ with exceptional uses, such as\nꖰ <color:#ffc933>upgrading your multiblocks</color>. Fight monsters\nꖰ to get what you need to <color:#ffc933>upgrade your compost</color>. \n\n"
    objectif:
      1: <color:#ffc933>Upgrade 1 compost
      2: <color:#ffc933>multiblock on your island
  compostcreate:
    astuce:
      1: <color:#ffc933>You got what you need to complete the multiblock
      2: <color:#ffc933>by completing</color><color:white> tutorial challenge 1
    message: '

      ꗍ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ Bzzt, I''m Mecanicus and here''s my teaching.

      ꖰ Create <color:#ffc933>a compost multiblock core</color> in

      ꖰ the workbench and <color:#ffc933>complete the compost</color> I left

      ꖰ on your island to prove your worth to me.


      '
    objectif:
      1: Create a compost multiblock <color:white>(/multiblocks)
  consumeregen:
    astuce:
      1: <color:#ffc933>The dish is created in a workbench multiblock
      2: '<color:#ffc933>More info: </color><color:white>/information cuisine'
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ These vanillas will help us <color:#ffc933>make sorbets</color>.\nꖰ Refreshing, and on top of that they give you back\nꖰ <color:#ffc933>health points when you eat them</color>!\n\n"
    objectif:
      1: <color:#ffc933>Consume 4 vanilla
      2: <color:#ffc933>milkshakes </color><color:white>(%tutoriel_shadow%/4)
  cookingbreak:
    astuce:
      1: <color:#ffc933>Vanilla is found in the
      2: <color:#ffc933>jungle dimension
      3: '<color:#ffc933>More info: </color><color:white>/information cuisine'
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ It's time to explore! These lands\nꖰ are full of <color:#ffc933>useful ingredients</color>. Use <color:#ffc933>the shears</color>\nꖰ obtained in the tutorial challenge\nꖰ to gather them!\n\n"
    objectif:
      1: Gather 16 vanillas </color><color:white>(%tutoriel_shadow%/16)
  createisland:
    astuce:
      1: '<color:#ffc933>Island reset</color> <color:white>: /is reset</color>'
      2: '<color:#ffc933>See the islands</color> <color:white>: /warp is</color>'
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ In our world, owning property is free.\nꖰ Everyone can have <color:#ffc933>an island</color> from the start!\nꖰ <click:run_command:'/warp is'><color:#ffc933>[Click here]</color></click> to be teleported to the <color:#ffc933>islands warp</color>\nꖰ to see them and choose one.\n\n"
    objectif:
      1: Create an island <color:white>(/is)</color>
  daily:
    astuce:
      1: '<color:#ffc933>Open the reward</color><color:white>: /daily'
      2: '<color:#ffc933>More info </color><color:white>: /information daily'
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Great, you got the challenge rewards!\nꖰ Want more? You can do <color:#ffc933>/daily</color>\nꖰ <color:#ffc933>every day</color> to get rewards!\n\n"
    objectif:
      1: Open a daily reward
  discovery_skip:
    astuce:
      1: '<color:#ffc933>Other tutorial command: </color>'
      2: <color:white>/tuto help</color>
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Welcome! I'll help you discover our world.\nꖰ <color:#ffc933>Complete the objectives</color> on the right of your screen to\nꖰ progress. And if an objective doesn't seem useful to you\nꖰ do <color:#ffc933>/tutoriel skip</color> to move on. Try it!\n\n"
    objectif:
      1: Use the command <color:white>/tuto skip</color>
  dungeoneasy:
    astuce:
      1: <color:#ffc933>/wiki dj
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Now that you're level 5 you'll be able to\nꖰ face <color:#ffc933>this dimension's dungeon</color>.\nꖰ Cross the portal <color:#ffc933>on the island at the very south</color>\nꖰ of the dimension or do <color:#ffc933>/donjon</color>.\n\n"
    objectif:
      1: <color:#ffc933>Finish the jungle
      2: <color:#ffc933>dungeon - easy </color><color:white>(/donjon)
  equip_tunic_noob:
    astuce:
      1: <color:#ffc933>You can get the beginner tunic
      2: <color:#ffc933>by completing</color><color:white> tutorial challenge 3
    message: "\nꗊ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ You now know your first enemies.\nꖰ But others, more powerful, await you!\nꖰ <color:#ffc933>Equip a beginner tunic</color> to\nꖰ be sufficiently protected.\n\n"
    objectif:
      1: Equip a beginner tunic
  error:
    no_active_step: You already finished the tutorial!
  finish:
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color> </b>\nꖰ Well, what a journey. You've become \nꖰ knowledgeable enough to manage on your own.\nꖰ I hope you've learned a lot. \n\n \nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ If you're afraid of getting bored without my great tutorial\nꖰ you can do the command <color:#ffc933>/wiki objectif</color>.\nꖰ I wrote a guide with many objectives\nꖰ to accomplish! Enjoy this adventure. \n\n"
    objectif:
      1: End
  finish_dungeon:
    astuce:
      1: <color:#ffc933>/wiki donjon
    message: "\nꗊ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ You seem to have potential. You're ready for\nꖰ a new challenge. Cross <color:#ffc933>the portal in</color>\nꖰ <color:#ffc933>the hunting ground cave</color> or use\nꖰ the command <color:#ffc933>/donjon</color>. \n\n"
    objectif:
      1: Finish the
      2: <color:#ffc933>apprentice hunter dungeon
  fishing:
    astuce:
      1: <color:#ffc933>/wiki peche
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ There's a big lake here. Right-click on\nꖰ <color:#ffc933>the magic fishing rod</color> in your inventory\nꖰ and <color:#ffc933>put insects in it</color>. You'll then be able to\nꖰ fish <color:#ffc933>special fish</color>!\n\n"
    objectif:
      1: Catch 8
      2: <color:#ffc933>magic fish </color><color:white>(%tutoriel_shadow%/8)
  islandlevel2:
    astuce:
      1: '<color:#ffc933>Deposit the block: <color:white>/is offrande'
      2: '<color:#ffc933>See how to create the block: </color><color:white>/crafts'
      3: '<color:#ffc933>More information: </color><color:white>/wiki offrande'
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ To upgrade your island, it needs to be at the right

      ꖰ level. We''re going to give a <color:#ffc933>plant level block</color>

      ꖰ to gain experience and bring

      ꖰ your island <color:#ffc933>to level 2</color>!


      '
    objectif:
      1: Be on a level 2 island
  islandupgradecobblegen:
    astuce:
      1: <color:#ffc933>/wiki isupgrade
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ Perfect, start by putting 15725 Mcoins in

      ꖰ <color:#ffc933>the island bank</color>. Then do <color:#ffc933>/is upgrade</color> to

      ꖰ open the upgrade menu and upgrade

      ꖰ <color:#ffc933>your ore generation</color>.


      '
    objectif:
      1: <color:#ffc933>Upgrade your island's ore generation
      2: <color:#ffc933>to level 2</color><color:white> (/is upgrade)
  ismenu:
    astuce:
      1: <color:#ffc933>/wiki ile
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ Congratulations, you have a great island!

      ꖰ Discover its features by doing <color:#ffc933>/ismenu</color>.

      ꖰ You can also go back to the spawn point

      ꖰ with the command <color:#ffc933>/spawn</color>.


      '
    objectif:
      1: Open the island menu <color:white>(/ismenu)</color>
  jungleportail:
    astuce:
      1: '<color:#ffc933>See how to build it:'
      2: /multiblocks
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ I think we're going on an adventure again!\nꖰ But for that we need <color:#ffc933>a new portal</color>.\nꖰ <color:#ffc933>Step 4 of the tutorial challenge</color> can give you\nꖰ the necessary elements.\n\n"
    objectif:
      1: <color:#ffc933>Create a jungle portal
      2: <color:#ffc933>multiblock on your island
  mailbox:
    astuce:
      1: '<color:#ffc933>Recipes in the multiblock</color>:'
      2: /crafts
      3: '<color:#ffc933>Info about the workbench multiblock</color>:'
      4: <color:#ffc933>/wiki mbetabli
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>\nꖰ We can now try to create a <color:#ffc933>mailbox</color>.\nꖰ You can see how to create them\nꖰ in <color:#ffc933>the recipe book in the multiblock</color>.\n\n"
    objectif:
      1: 'Create 1 mailbox '
  mailboxopen:
    astuce:
      1: <color:#ffc933>/wiki boitelettre
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ <color:#ffc933>Click</color> on your mailbox to open it,

      ꖰ there will regularly be rewards in it! You can

      ꖰ also do the command <color:#ffc933>/mail</color> if you have

      ꖰ the enchanter rank.


      '
    objectif:
      1: Open your mailbox
  mobkill:
    astuce:
      1: <color:#ffc933>/wiki element
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ This wand has high stats\nꖰ <color:#ffc933>in water element</color>. This means it will deal\nꖰ <color:#ffc933>more damage to monsters of this element</color>.\nꖰ Try killing some tree frogs with it!\n\n"
    objectif:
      1: Kill 16 green tree frogs </color><color:white>(%tutoriel_shadow%/16)
  orangeblock:
    astuce:
      1: '<color:#ffc933>See how to create the block: </color><color:white>/crafts'
      2: '<color:#ffc933>More information: </color><color:white>/wiki islevel'
    message: "\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Before making a new visit we need to\nꖰ <color:#ffc933>upgrade the level block</color> that you gave.\nꖰ Deposit an <color:#ffc933>incomplete orange level block</color>\nꖰ as an offering to see the result!\n\n"
    objectif:
      1: <color:#ffc933>Deposit 1 incomplete orange
      2: <color:#ffc933>level block on the island </color><color:white>(/is offrande)
  portailcreate:
    astuce:
      1: <color:#ffc933>You got what you need to complete the multiblock
      2: <color:#ffc933>by completing</color><color:white> tutorial challenge 2
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Great, as a reward for this challenge you got\nꖰ <color:#ffc933>a great sword</color> and what you need to create <color:#ffc933>a multiblock</color>\nꖰ <color:#ffc933>portal</color>. Create it and let's discover this new world!\n\n"
    objectif:
      1: Have a hunting ground
      2: <color:#ffc933>portal multiblock on the island </color><color:white>(/multiblocks)</color>
  reset: "{name}'s tutorial progress has been reset"
  shopcreate:
    astuce:
      1: <color:#ffc933>/wiki shopjoueur
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Now we're going to fill this warp with <color:#ffc933>player</color>\nꖰ <color:#ffc933>shops</color>! Place a sign on\nꖰ a chest and follow the instructions.\n\n"
    objectif:
      1: Create a player shop
      2: <color:#ffc933>on your island
  spawnercreate:
    astuce:
      1: <color:#ffc933>/wiki spawner
    message: "\nꗊ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b> \nꖰ Good, excellent! <color:#ffc933>Dungeon chests</color>\nꖰ will give you what you need to <color:#ffc933>create spawners</color>.\nꖰ I'll give you some useful items,\nꖰ create one and MASSACRE THE MONSTERS.\n\n"
    objectif:
      1: Create 1 spawner
  terrainchasse:
    astuce:
      1: '<color:#ffc933>See the challenges: </color><color:white>/challenge'
      2: '<color:#ffc933>More information: </color><color:white>/wiki challenge'
    message: '

      ꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>

      ꖰ We''re going to leave the island and discover the incredible

      ꖰ <color:#ffc933>dimensions</color>! For that we''ll need items

      ꖰ that you can get by completing <color:#ffc933>tutorial</color>

      ꖰ <color:#ffc933>challenge 2</color>. Finish it!


      '
    objectif:
      1: Complete tutorial challenge 2
  tinker:
    astuce:
      1: '<color:#ffc933>See how multiblocks are created: </color><color:white>/multiblocks'
      2: '<color:#ffc933>More information: </color><color:white>/wiki etabli'
    message: "\nꗉ \nꖰ <b><color:#ffc933>[</color><color:#2bfff4>Tutorial</color><color:#ffc933>]</color></b>\nꖰ We now need <color:#ffc933>a machine</color> to create\nꖰ special items: a <color:#ffc933>workbench multiblock</color>. Do\nꖰ <color:#ffc933>/multiblocks</color> to see how to create it!\n\n"
