  tutoriel_intro_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Bienvenue ! Je suis Magibou et je vais t''aider\nꖰ pour ce tutoriel. Commençons par les bases :\nꖰ Fais /tuto ou <click:run_command:''/tuto''><glyph:left_click> <white>[</white><color:#ffc933>clique ici</color><white>]</white></click> pour voir les étapes\nꖰ et les objectifs à accomplir !'
  tutoriel_intro_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu as dû voir dans le /tuto la seconde étape :\nꖰ ouvrir le <click:run_command:''/menu''><glyph:left_click> <white>[</white><color:#ffc933>menu général</color><white>]</white></click> ! Clique sur les icônes\nꖰ pour accéder aux menus de la plupart des\nꖰ fonctionnalités de MagicalSky.'
  tutoriel_intro_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu as vu les fonctionnalités générales mais pas\nꖰ celles liées à ta progression. Ouvre ton <click:run_command:''/profil''><glyph:left_click> <white>[</white><color:#ffc933>profil</color><white>]</white></click>\nꖰ pour voir où tu en es !\nꖰ'
  tutoriel_intro_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu sais des choses mais tu es loin de tout\nꖰ savoir ! Pour ne pas te perdre tu peux faire\nꖰ à tout instant <click:run_command:''/help''><glyph:left_click> <white>[</white><color:#ffc933>/help</color><white>]</white></click> pour voir l''utilité des\nꖰ commandes les plus importantes.'
  tutoriel_intro_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ En plus des commandes tu as la possibilité de\nꖰ savoir tout sur tout sur TOUT L''UNIVERS de\nꖰ MagicalSky ! Pour ça un seul endroit : <click:run_command:''/wiki''><glyph:left_click> <white>[</white><color:#ffc933>/wiki</color><white>]</white></click> !\nꖰ'
  tutoriel_intro_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Et s''il te manque encore une dernière information\nꖰ tu peux directement la poser au staff ou aux\nꖰ joueurs directement sur notre <click:run_command:''/discord''><glyph:left_click> <white>[</white><color:#ffc933>discord</color><white>]</white></click>. C''est\nꖰ aussi un moyen d''être informé des nouveautés !'
  tutoriel_intro_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Enfin, une dernière commande avant de se lancer,\nꖰ fais <click:run_command:''/kit''><glyph:left_click> <white>[</white><color:#ffc933>/kit</color><white>]</white></click> pour voir les kits et recevoir des\nꖰ récompenses pour bien débuter.\nꖰ'
  tutoriel_ile_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Bien, on va maintenant créer ton île ! C''est un\nꖰ choix important donc fais <click:run_command:''/warps is''><glyph:left_click> <white>[</white><color:#ffc933>/warps is</color><white>]</white></click> pour voir\nꖰ les îles de départ et faire le bon choix !\nꖰ'
  tutoriel_ile_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Il est l''heure de créer ton île ! Fais <click:run_command:''/is''><glyph:left_click> <white>[</white><color:#ffc933>/is</color><white>]</white></click> et\nꖰ choisis celle qui te plaît. Si des amis t''ont\nꖰ invité sur leur île tu peux les rejoindre avec\nꖰ <click:run_command:''/is team''><glyph:left_click> <white>[</white><color:#ffc933>/is team</color><white>]</white></click> !'
  tutoriel_ile_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu as enfin ton chez-toi ! Pour gérer toutes les\nꖰ fonctionnalités de ton île tu peux faire\nꖰ <click:run_command:''/ismenu''><glyph:left_click> <white>[</white><color:#ffc933>/ismenu</color><white>]</white></click> et voir tout ce qu''elle te réserve !\nꖰ'
  tutoriel_ile_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Et si on faisait place nette pour préparer l''étape\nꖰ supérieure ? Mais pour ça il nous faut de bons\nꖰ outils ! Casse la bûche et la pierre dans\nꖰ lesquels sont plantés tes futurs outils préférés.'
  tutoriel_ile_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Enfin du boulot pour moi ! Je suis Forgelia,\nꖰ déesse des outils magiques. Je te donne quelques\nꖰ runes, utilise les pour débloquer des compétences\nꖰ avec la commande <click:run_command:''/competence''><glyph:left_click> <white>[</white><color:#ffc933>/competence</color><white>]</white></click> !'
  tutoriel_ile_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ On dirait que tu intéresses les dieux ! Ils sont\nꖰ gentils mais ils ne t''aideront pas à devenir\nꖰ riche ! Pour cela tu dois débloquer un métier.\nꖰ Choisis le mineur avec la commande <click:run_command:''/jobs''><glyph:left_click> <white>[</white><color:#ffc933>/jobs</color><white>]</white></click> !'
  tutoriel_ile_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Maintenant que tu es mineur : minons ! Tu peux\nꖰ utiliser le générateur sur l''île pour casser\nꖰ du caillou mais il va aussi faire apparaître\nꖰ plein d''autres minerais !'
  tutoriel_ile_8: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ En cassant du cailloux tu as complété un\nꖰ challenge ! Ils te donnent des récompenses\nꖰ automatiquement quand tu les complète. Fais\nꖰ <click:run_command:''/challenge''><glyph:left_click> <white>[</white><color:#ffc933>/challenge</color><white>]</white></click> pour tous les voir.'
  tutoriel_niveau_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Pour obtenir de meilleurs minerais on va\nꖰ améliorer ton île ! Et cela va nécessiter de\nꖰ créer une machine spéciale : un multiblock !\nꖰ Fais <click:run_command:''/multiblocks''><glyph:left_click> <white>[</white><color:#ffc933>/multiblocks</color><white>]</white></click> pour voir les machines dispos.'
  tutoriel_niveau_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Dans le menu il y a un établi. En cliquant dessus\nꖰ tu as plein de moyens de voir comment créer\nꖰ le multiblock. Fais en un et n''oublie pas de\nꖰ placer la table de craft !'
  tutoriel_niveau_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Pour voir comment créer des objets avec\nꖰ le multiblock tu peux faire <click:run_command:''/recette''><glyph:left_click> <white>[</white><color:#ffc933>/recette</color><white>]</white></click> ou voir\nꖰ directement depuis le multiblock. On va pouvoir\nꖰ créer de quoi améliorer ton île !'
  tutoriel_niveau_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Le Dieu Islandus aime les blocs de niveaux. On\nꖰ va en créer grâce au multiblock et lui donner !\nꖰ Je te donne quelques objets pour en créer un\nꖰ de valeur 1. Essaie !'
  tutoriel_niveau_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Bien, on a plus qu''à entrer en contact avec\nꖰ Islandus ! Utilise la commande <click:run_command:''/is level''><glyph:left_click> <white>[</white><color:#ffc933>/is level</color><white>]</white></click> et\nꖰ clique sur le bouton "Offrande". Cela va lui\nꖰ donner et tu obtiendras de l''xp d''île ! \nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Cette première Offrande me plaît. Mais j''en veux\nꖰ PLUS. Donne m''en et je donnerai des statistiques\nꖰ à ton île.\nꖰ'
  tutoriel_niveau_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Islandus lui même t''as parlé ! Il aime les blocs\nꖰ de niveau mais aussi les Mcoins, notre monnaie\nꖰ locale. Fais /money pour voir combien tu en as !\nꖰ'
  tutoriel_niveau_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ On va avoir besoin de MCoins pour continuer à\nꖰ faire progresser ton île. Obtiens-en en\nꖰ vendant des ressources dans le <click:run_command:''/shop''><glyph:left_click> <white>[</white><color:#ffc933>/shop</color><white>]</white></click> !\nꖰ'
  tutoriel_niveau_9: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Bien, pas encore riche mais on avance !\nꖰ Fais <click:run_command:''/is bank''><glyph:left_click> <white>[</white><color:#ffc933>/is bank</color><white>]</white></click> pour accéder à ta banque d''île.\nꖰ On va avoir besoin de la remplir un peu pour\nꖰ la prochaine étape.'
  tutoriel_niveau_10: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ On a de l''XP d''île, on a des Mcoins en banque,\nꖰ c''est l''heure d''un rituel ! Ils te permettent\nꖰ d''améliorer régulièrement tes statistiques d''île.\nꖰ Fais un rituel commun pour améliorer l''île.'
  tutoriel_niveau_11: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Le rituel commun que tu as fait est bien mais\nꖰ on peut faire mieux ! Avec plus d''XP accumulée\nꖰ et plus de Mcoin on peut faire un rituel rare.\nꖰ Je te donne une petite avance pour t''aider.'
  tutoriel_niveau_12: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Allons vois les fruits de ton travail ! Avec\nꖰ <click:run_command:''/is stat''><glyph:left_click> <white>[</white><color:#ffc933>/is stat</color><white>]</white></click> tu peux voir les stats actuelles de\nꖰ ton île. Elles sont améliorées par les rituels et\nꖰ aussi par un autre système qu''on va découvrir.'
  tutoriel_niveau_13: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu peux obtenir des stats grâce aux rituels mais\nꖰ aussi en faisant passer ton ile de niveau !\nꖰ Tu peux regarder dans le <click:run_command:''/is level''><glyph:left_click> <white>[</white><color:#ffc933>/is level</color><white>]</white></click> les stats\nꖰ obtenues au prochain niveau d''île !'
  tutoriel_niveau_14: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Chaque niveau te donne des stats d''île mais\nꖰ aussi d''autres récompenses. Fais <click:run_command:''/recompense''><glyph:left_click> <white>[</white><color:#ffc933>/recompense</color><white>]</white></click>\nꖰ pour les voir et les récupérer !\nꖰ'
  tutoriel_cles_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les récompenses d''île donnent aussi des\nꖰ cosmétiques ! Ils sont de plusieurs types et tu\nꖰ peux les voir et les équiper grâce à la commande\nꖰ <click:run_command:''/cosmetic''><glyph:left_click> <white>[</white><color:#ffc933>/cosmetic</color><white>]</white></click>.'
  tutoriel_cles_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Il faut bosser pour obtenir des niveaux d''île\nꖰ mais avoir des récompenses peut être aussi\nꖰ simple que se connecter ! Connecte-toi chaque jour\nꖰ et fais <click:run_command:''/daily''><glyph:left_click> <white>[</white><color:#ffc933>/daily</color><white>]</white></click> pour récupérer une clé !'
  tutoriel_cles_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Sur MagicalSky tu recevras des clés pour\nꖰ célébrer ta progression. Au plus c''est difficile,\nꖰ au mieux est la clé ! Je t''offre une SuperClé,\nꖰ fais <click:run_command:''/lobby''><glyph:left_click> <white>[</white><color:#ffc933>/lobby</color><white>]</white></click> et utilise la sur une SuperBox !'
  tutoriel_cles_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les SuperClés peuvent te donner des choses très\nꖰ variées mais certaines clés sont liées à d''autres\nꖰ fonctionnalités, comme les métiers ! Voici une clé\nꖰ de boîte de mineur, essaie-là !'
  tutoriel_cles_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les récompenses que tu as reçu sont envoyée dans\nꖰ ton inventaire mais elles peuvent aussi être\nꖰ envoyé dans ta boîte aux lettres. Il y en a une\nꖰ de base sur ton île, essaie de l''ouvrir.'
  tutoriel_bucheron_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les blocs de niveau 1 sont super mais il nous\nꖰ faudra mieux pour que ton île atteigne des\nꖰ sommets ! Et ça passe par un nouveau métier,\nꖰ <click:run_command:''/jobs''><glyph:left_click> <white>[</white><color:#ffc933>le bûcheron</color><white>]</white></click>. Débloque-le et je t''explique.'
  tutoriel_bucheron_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Le bloc de niveau 2 nécessite d''avoir des fragments\nꖰ des arbres. Tu as des chances d''en obtenir en\nꖰ en gagnant de l''xp de bûcheron. Essaie d''en avoir\nꖰ en cassant des bûches de chêne.'
  tutoriel_bucheron_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Le bûcheronage c''est du cassage de bûches mais\nꖰ les feuilles nous intéressent ! Elles contiennent\nꖰ de petits insectes qui valent pas mal de MCoins.\nꖰ Essaie de récupérer quelques insectes communs.'
  tutoriel_bucheron_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ On a vu ensemble que les niveaux d''île t''offrent\nꖰ des récompenses. Les niveaux de métier aussi !\nꖰ Passe le niveau 2 de bûcheron et on va voir les\nꖰ cadeaux que tu peux obtenir.'
  tutoriel_bucheron_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ C''est parfait, tu sais presque tout des métiers !\nꖰ Tu mérites une petite récompense, va les chercher\nꖰ en faisant <click:run_command:''/recompense''><glyph:left_click> <white>[</white><color:#ffc933>/recompense</color><white>]</white></click> !\nꖰ'
  tutoriel_bucheron_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Métier 2 maîtrisé = bloc de niveau d''île 2 à\nꖰ créer ! Fais en un et donne le à ton île pour\nꖰ continuer à améliorer ses statistiques.\nꖰ'
  tutoriel_agriculteur_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Encore un meilleur bloc de niveau ? C''est le\nꖰ programme du jour ! On va mettre les mains dans\nꖰ la terre grâce au métier agriculteur ! Fais\nꖰ <click:run_command:''/jobs''><glyph:left_click> <white>[</white><color:#ffc933>/jobs</color><white>]</white></click> et débloque-le.'
  tutoriel_agriculteur_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Pour ce métier on va avoir besoin de terre,\nꖰ beaucoup de terre ! Pour ça on va compléter le\nꖰ multiblock compost qui est sur ton île de base.\nꖰ Fais /multiblocks pour voir où placer les blocs !'
  tutoriel_agriculteur_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Maintenant, rien de plus simple : on fait des\nꖰ champs, on les regarde pousser et on récolte.\nꖰ Je te laisse faire ça pour avoir de quoi créer un\nꖰ bloc de niveau 3 !'
  tutoriel_agriculteur_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu commences à progresser, c''est très bien !\nꖰ Et si on regardais où tu en es par rapport aux\nꖰ autres ? Fais <click:run_command:''/classement''><glyph:left_click> <white>[</white><color:#ffc933>/classement</color><white>]</white></click> pour voir qui sont\nꖰ les plus forts !'
  tutoriel_chasseur_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Cette île est trop petite pour un farmer\nꖰ d''exception comme toi. On va partir explorer !\nꖰ Pour ça on a besoin d''un multiblock portail du\nꖰ terrain de chasse. C''est l''heure de l''aventure !'
  tutoriel_chasseur_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ La chasse commence ! Débloque le métier chasseur\nꖰ et on va aller récupérer de précieuses ressources\nꖰ sur les monstres terrifiants de notre monde.\nꖰ'
  tutoriel_chasseur_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Pour aller au terrain de chasse tu peux utiliser\nꖰ le portail ou faire <click:run_command:''/dimtp''><glyph:left_click> <white>[</white><color:#ffc933>/dimtp</color><white>]</white></click>. Dans le dimtp tu\nꖰ verras les icônes des balises. Clique surnꖰ celles que tu vois pour les débloquer.'
  tutoriel_chasseur_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ les balises te permettent de te déplacer\nꖰ rapidement en dimension. Utile pour découvrir\nꖰ les zones et les monstres qui les habitent. Fais\nꖰ <click:run_command:''/bestiaire''><glyph:left_click> <white>[</white><color:#ffc933>/bestiaire</color><white>]</white></click> pour voir ceux que tu as vaincu.'
  tutoriel_chasseur_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Oh tiens, t''es encore vivant ! Si tu veux le\nꖰ rester il te faut du meilleur équipement. Je te\nꖰ donne cette armure du débutant, équipe là pour\nꖰ avoir des stats bonus face aux monstres !'
  tutoriel_chasseur_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Cette armure est spéciale car elle est incassable\nꖰ mais aussi car tu peux lui équiper des\nꖰ compétences ! Fais <click:run_command:''/competence''><glyph:left_click> <white>[</white><color:#ffc933>/competence</color><white>]</white></click> et débloque\nꖰ la première disponible.'
  tutoriel_chasseur_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Visiblement la déesse Forgelia t''apprécie ! Grâce\nꖰ à l''équipement qu''elle t''a donné on peut tenter\nꖰ un nouveau défi : le donjon ! Tu trouveras le portail\nꖰ pour y accéder sous la ferme.'
  tutoriel_chasseur_8: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Maintenant que tu sais tout sur le métier chasseur\nꖰ on peut créer le bloc de niveau 4. Tout ça\nꖰ commence à bien améliorer ton île, je suis\nꖰ fier de ta progression !'
  tutoriel_pecheur_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tout ces combats ça m''a fatigué... Et si on\nꖰ progressait plus paisiblement ? Pour ça j''ai un\nꖰ nouveau métier en stock : le pêcheur. Débloque-le\nꖰ grâce dans le menu du <click:run_command:''/jobs''><glyph:left_click> <white>[</white><color:#ffc933>/jobs</color><white>]</white></click>.'
  tutoriel_pecheur_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Ce monde regorge de poissons magiques. Pour en\nꖰ pêcher tu dois faire un clic droit sur ta canne\nꖰ à pêche depuis ton inventaire et glisser dedans\nꖰ des insectes. C''est l''heure de la pêche !'
  tutoriel_pecheur_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les poissons pêchés dépendent des biomes dans\nꖰ lesquels tu pêches. Pour tous les attraper tu\nꖰ peux changer le biome de ton île avec\nꖰ <click:run_command:''/is biome''><glyph:left_click> <white>[</white><color:#ffc933>/is biome</color><white>]</white></click>. Commence par la haute mer !'
  tutoriel_pecheur_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les poissons dépendent aussi de la rareté de\nꖰ l''insecte utilisé ! Je te donne quelques insectes\nꖰ épiques, mets les sur ta canne pour pêcher de\nꖰ beaux poissons !'
  tutoriel_pecheur_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Il existe certains challenges qui te demandent de\nꖰ pêcher tout les poissons du monde pour compléter\nꖰ ton fishdex. Attrapez les tous !\nꖰ'
  tutoriel_pecheur_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Pour créer le bloc de niveau 5 il va nous falloir\nꖰ de nouveaux multiblocks ! On va commencer par le\nꖰ broyeur. Il suffit de mettre des ressources et\nꖰ de la redstone dedans pour broyer les blocs !'
  tutoriel_pecheur_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Ce crusher te permet de créer plein d''objets,\nꖰ notamment de la tuf. On va en utiliser pour créer\nꖰ un autre multiblock qui crée aussi des\nꖰ ressources spéciales : le haut-fourneau !'
  tutoriel_pecheur_8: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Le pêcheur c''est maîtrisé, on a tout pour le bloc\nꖰ de niveau 5 ! Il ne nous manque plus qu''un métier\nꖰ mais pour lui on va encore devoir voyager.\nꖰ Occupe-toi du bloc de niveau 5 et on y regarde.'
  tutoriel_cuisinier_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu trouvais le terrain de chasse grand ? On a\nꖰ bien plus grand à découvrir ! Construis le\nꖰ portail de la dimension jungle grâce aux quelques\nꖰ objets que je t''offre et on part à l''aventure.'
  tutoriel_cuisinier_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Enfile ta toque de chef car le dernier métier va\nꖰ nous emmener créer de délicieux petits plats.\nꖰ Débloque le cuisinier dans le <click:run_command:''/jobs''><glyph:left_click> <white>[</white><color:#ffc933>/jobs</color><white>]</white></click> et on passe\nꖰ à la récolte. LET HIM COOK.'
  tutoriel_cuisinier_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ La dimension est grande, très grande, mais les\nꖰ dieux t''ont prévu une petite aide ! Fais <click:run_command:''/cine''><glyph:left_click> <white>[</white><color:#ffc933>/cine</color><white>]</white></click>\nꖰ pour accéder à des cinématiques qui t''aident\nꖰ à trouver les zones de farm du cuisinier.'
  tutoriel_cuisinier_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Grâce au ciné tu devrais savoir désormais où\nꖰ trouver des plants de vanille. Il est l''heure\nꖰ de se lancer dans la récolte !\nꖰ'
  tutoriel_cuisinier_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les nourritures du cuisinier se vendent mais\nꖰ elles servent aussi en combat ! Tu mets un peu\nꖰ de temps à régénérer après avoir subi des dégâts,\nꖰ mais tu peux régénérer direct grâce à ces plats !'
  tutoriel_cuisinier_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ La cuisine n''a plus de secrets pour toi, plus\nꖰ qu''à créer le bloc de niveau 6 ! Tu connais\nꖰ désormais les bases de notre monde, on va donc\nꖰ passer aux choses sérieuses !'
  tutoriel_forge_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Pour le moment je t''ai offert des objets mais tu\nꖰ as bien grandit, tu es désormais près pour en\nꖰ créer toi même. Crée un multiblock forge.\nꖰ'
  tutoriel_forge_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ La tunique du débutant est trop faible pour toi.\nꖰ Affronte les pandas à l''ouest du temple et crée\nꖰ un Chapanda, un bien meilleur chapeau que celui\nꖰ que tu as actuellement.'
  tutoriel_forge_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ HUMAIN, JE SENS DE LA MAGIE EN TOI.\nꖰ IL TE FAUT UNE BAGUETTE POUR LA CANALISER.\nꖰ CREES-EN UNE DANS LE MULTIBLOCK FORGE.\nꖰ'
  tutoriel_forge_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ TU DOIS DEBLOQUER PLUS DE SORTS.\nꖰ UN PARCHEMIN SE TROUVE AU VILLAGE DE L''EAU.\nꖰ CLIQUE DESSUS ET DEBLOQUE LE SORT.\nꖰ'
  tutoriel_forge_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ CES MONSTRES SONT MISERABLES FACE\nꖰ A LA MAGIE. UTILISE-LA POUR LES OBLITERER.\nꖰ \nꖰ'
  tutoriel_forge_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Sorcellia m''a coupé la parole, mais je vais pas\nꖰ me laisser faire ! Tu connais les armures et les\nꖰ baguettes mais d''autres armes magiques puissantes\nꖰ existent. Crée la Grelame verte.'
  tutoriel_forge_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ TU DOIS DEBLOQUER PLUS DE SORTS.\nꖰ LE SORT COUPE-HERBE SE TROUVE AU FOND DE\nꖰ LA FORÊT DE BAMBOUS. DEBLOQUE-LE.\nꖰ'
  tutoriel_forge_8: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Ouf, je peux enfin en placer une... Dans la\nꖰ dimension il y a plusieurs zones bloquées. Tu\nꖰ peux y accéder et récupérer des objets de métier\nꖰ spéciaux dedans. Essaie avec le bambou doré !'
  tutoriel_amelioration_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Elle m''a encore coupé ! Bon, j''en étais où ? Ah\nꖰ oui, l''usage de la forge ! Elle te sert aussi à\nꖰ créer des objets pour ton île. Crée un\nꖰ chunk hopper.'
  tutoriel_amelioration_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Les outils que je t''ai donné ne te permettent pas\nꖰ de débloquer beaucoup de compétences. Crée une\nꖰ Pioche en bambou plus puissante.\nꖰ'
  tutoriel_amelioration_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Bien, ces deux multiblocks nous aident à faire\nꖰ le multiblock qui nous intéresse le plus :\nꖰ l''améliorateur ! Crée le et on voit ensuite\nꖰ ensemble comment l''utiliser.'
  tutoriel_amelioration_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tes outils ont besoin de puissance pour pouvoir\nꖰ accueillir des compétences sans exploser.\nꖰ On va utiliser l''améliorateur pour le faire !\nꖰ Utilise le pour améliorer ta pioche en bambou !'
  tutoriel_amelioration_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tes équipements sont améliorables mais tes\nꖰ multiblocks aussi ! Pour ça pas besoin d''autre\nꖰ multiblock : il te suffit de cliquer sur ton\nꖰ multiblock et appuyer sur le bouton d''upgrade.'
  tutoriel_vente_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu commences à avoir de nombreux objets spéciaux\nꖰ qui ne sont pas vendables au shop. Mais d''autres\nꖰ peuvent être intéressés ! Pour ça une seule\nꖰ adresse : <click:run_command:''/ah''><glyph:left_click> <white>[</white><color:#ffc933>/ah</color><white>]</white></click> !'
  tutoriel_vente_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ L''hôtel des ventes est bien pour vendre des\nꖰ objets précieux mais dur d''y vendre en grande\nꖰ quantité. Tu peux cependant le faire sur ton île\nꖰ en posant une pancarte sur un coffre. Teste-ça !'
  tutoriel_vente_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Ces coffres de ventes sont cool, mais comment les\nꖰ autres peuvent y accéder ? Grâce aux warps d''île !\nꖰ Fais <click:run_command:''/is warps''><glyph:left_click> <white>[</white><color:#ffc933>/is warps</color><white>]</white></click> pour voir les warps des autres\nꖰ et <click:run_command:''/is setwarp''><glyph:left_click> <white>[</white><color:#ffc933>/is setwarp</color><white>]</white></click> pour en créer un !'
  tutoriel_vente_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Assez vendu aux autres joueurs ! On veut aussi\nꖰ vendre au shop, mais automatiquement cette fois !\nꖰ Pour ça, crée un coffre automatique dans la forge.\nꖰ Au plus il est rare, au plus il vend vite !'
  tutoriel_vente_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Tu peux vendre des objets mais le monde de\nꖰ MagicalSky en vend également ! Tu peux faire\nꖰ <click:run_command:''/boutique''><glyph:left_click> <white>[</white><color:#ffc933>/boutique</color><white>]</white></click> pour voir les différentes possibilités\nꖰ et en acheter pour aider MagicalSky !'
  tutoriel_qetzir_1: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Maintenant que tu sais vendre, nous devons trouver\nꖰ de meilleurs objets ! Et cela se fait dans la zone\nꖰ de niveau 5+ de la dimension de Qetzir. Augmente\nꖰ ton niveau de <click:run_command:''/classe''><glyph:left_click> <white>[</white><color:#ffc933>classe</color><white>]</white></click> pour passer.'
  tutoriel_qetzir_2: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Cette zone est pleine d''ingrédients à cuisiner.\nꖰ Tu peux par exemple trouver des fraises\nꖰ qui permettent de préparer des plats qui se\nꖰ vendent bien.'
  tutoriel_qetzir_3: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Avec le ventre plein on peut aller se battre !\nꖰ On trouve aussi dans cet endroit des donjons !\nꖰ Je te téléporte devant l''entrée du donjon de\nꖰ niveau 5.'
  tutoriel_qetzir_4: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Dans cette zone tu peux aussi créer de meilleurs\nꖰ armes et outils ! Les monstres de la forêt près\nꖰ du volcan te permettront de créer une super\nꖰ Piocheuse de Ruche surpuissante !'
  tutoriel_qetzir_5: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Et si je te disais qu''il nous reste de supers\nꖰ multiblocks à découvrir ? Le multiblock générateur\nꖰ à cobble génère automatiquement des minerais.\nꖰ On va en créer un !'
  tutoriel_qetzir_6: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Farm les spawners un à un c''est pénible. J''ai un\nꖰ dernier multiblock pour toi : le multiblock à\nꖰ spawner ! Tu peux y mettre plusieurs spawners\nꖰ et tout tuer d''un coup. Super pratique !'
  tutoriel_qetzir_7: '\nꗉ <b><color:#ffc933>[</color><color:#2bfff4>Tutoriel</color><color:#ffc933>]</color></b> \nꖰ Et bien je crois que tu connais les\nꖰ fonctionnalités importantes, je te libère de mon\nꖰ tutoriel ! Merci d''avoir été un bon apprenti. Mais\nꖰ ce monde est très vaste, continue à explorer !'