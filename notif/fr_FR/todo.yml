    active: <green><bold> Compétence activée </bold>pour {name}</green>
    inactive: <red><bold> Compétence désactivée </bold>pour {name}</red>
  sort:
    fail:
      profil_not_found: "Impossible de lancer ce sort : profil introuvable."
      no_competence_data: Impossible de lancer ce sort pour le moment.
      wrong_level: Ton niveau de compétence ne permet pas ce sort.
      not_unlocked: Tu n'as pas débloqué ce sort.
      not_active: Cette compétence n'est pas active.
      type_not_possible: Cet objet ne permet pas de lancer ce sort.
      damage_ticks: Tu ne peux pas lancer ce sort juste après avoir été touché.
      no_rarity: Cet objet n'a pas de rareté valide pour ce sort.
      level_requirement: Tu dois être niveau {niveau_requis} (tu es niveau {niveau_joueur}) pour lancer ce sort.
      chance_failed: Le sort a échoué (malchance).
      wrong_world: Ce sort n'est pas utilisable dans ce monde.
      no_mana: "Mana insuffisante : il te manque {mana_manquante} mana (requis : {mana_requise})."
      no_sort: Aucun sort assigné à cette action.
      code: Une erreur est survenue lors du lancement du sort.
      on_cooldown: Ce sort est en recharge, réessaie dans {cooldown_restant}s.
      no_data: Impossible de lancer ce sort pour le moment.
      jobs_blocks: Tu ne peux pas lancer ce sort ici.
    add: <glyph:validation_tchat> <color:#40ff70> Tu viens d'ajouter le sort {skillname} sur ta baguette !
    max: <glyph:warning_tchat> <color:#ff383b> Tu as déjà le nombre maximal de sort sur ta baguette !
    notremove: <glyph:warning_tchat> <color:#ff383b> Tu ne peux pas retirer ce sort
    remove: <glyph:validation_tchat> <color:#40ff70> Tu viens de retirer le sort de ta baguette !
  sound:
    active: <green><bold> Son activé </bold>pour {name}</green>
    inactive: <red><bold> Son désactivé </bold>pour {name}</red>
dungeon:
  already:
    builder: Tu es déjà dans une session de donjon en création
    in: Tu es déjà dans un donjon
  build: La session du donjon a été créée
  builderror: 'Une erreur est survenue lors de la création du donjon : {error}, par prévention, celui-ci a été annulé'
  death: '{playername} a perdu une vie dans le donjon'
  global:
    end: Le donjon de {owner} vient de se finir !
  invite:
    accept: Tu as rejoint le donjon !
    acceptall: '{playername} a rejoint le donjon'
    edit: Modification de la session détectée, le cooldown de création de la session est réinitialisé
    refuse: Tu as refusé l'invitation au donjon
    refuseall: '{playername} a refusé l''invitation au donjon'
    remove: Tu as été éjecté du donjon
    removeall: '{playername} a été éjecté du donjon'
    removeinvited: Ton invitation au donjon a expiré
    send: Tu as été invité à rejoindre le donjon de {ownername}, fais /donjon pour accepter ou refuser
    sendall: '{playername} a été invité à rejoindre le donjon'
  notifwhenstart: La session a été mise dans la file d'attente, une notification te sera envoyée quand la session sera presque créée. Tu peux toujours ajouter des membres pendant ce temps.
  retarded: Toutes les instances de ce donjon sont prises, tu seras téléporté lorsqu'une place sera disponible, place {place}
  startbuild: La session du donjon sera créée dans 30 secondes
