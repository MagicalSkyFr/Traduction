upgradeisland:
  limit_reached_block_view: Tu as atteint le maximum de <white>{block}</white> sur ton île ({actual}/{max})
  limit_reached_entity_view: Tu as atteint le maximum de <white>{entity}</white> sur ton île ({actual}/{max})
  no_offrande: Tu n'as pas d'offrande dans ton inventaire
  offrande_given: <glyph:validation_tchat> <color:#40ff70>Tu viens de donner des offrandes à ton île pour <white>{xp} xp</white></color>
  ritual_not_available: Aucun rituel n'est disponible pour le moment sur ton île
  ritual_on_cooldown: Tu dois attendre la fin du cooldown avant de lancer un nouveau rituel

classe:
  notspell: "Ce n'est pas une baguette"
  armor:
    level_requirement: Tu dois être niveau {niveau_requis} pour porter cet item (tu es niveau {niveau_joueur})
  upgrade_station:
    stat_added: "Ton arme a gagné +{value} de {stat}"
    config:
      error: "Une erreur est survenue lors de la configuration de la station d'amélioration : {error}"
    add_points: "Tu as ajouté {points} points d'amélioration à ton item"
    no_item: "Tu n'as aucun item améliorable dans ta main principale"
    no_nbt: "Ce n'est pas un item de classe ou de métier"
  stats:
    armor:
      change: "{slot} a changé, par conséquent tes points de vie ont été mis à jour : {amount}"
    hp:
      change: "Ton arme en main a changé, par conséquent tes points de vie max ont été mis à jour : {amount}"
      remove: "Tu n'as plus d'arme avec des statistiques d'HP dans ta main, tu as donc perdu {amount} points de vie maximum"
    apply: Les statistiques de ta classe ont été appliquées
  armor_complete:
    noskill: <glyph:validation_tchat> <color:#40ff70>Ton armure est intégralement équipée</color>
    skill: <glyph:validation_tchat> <color:#40ff70>Ton armure est intégralement équipée, tu bénéficies de la compétence {skill} en bonus !</color>
  armor_full_required: <glyph:warning_tchat> <color:#ff383b>Tu dois porter une armure intégrale pour profiter de la compétence bonus !</color>
  armor_missing: <glyph:warning_tchat> <color:#ff383b>Ton armure n'est pas intégralement équipée, équipe toi d'un set d'armure pour bénéficier des compétences sur ton armure</color>
  notskilloffhand: <glyph:warning_tchat> <color:#ff383b> Tu ne peux lancer de sort si ton item de la deuxième main est aussi un item avec des compétences
